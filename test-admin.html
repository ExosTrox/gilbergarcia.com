<!DOCTYPE html>
<html>
<head>
    <title>Admin Test</title>
</head>
<body>
    <h1>Test Admin Features</h1>
    
    <h2>1. Test Password:</h2>
    <input type="password" id="testPass" placeholder="Enter password">
    <button onclick="testPassword()">Test</button>
    <div id="result"></div>
    
    <h2>2. Test Post Creation:</h2>
    <button onclick="createTestPost()">Create Test Post</button>
    <div id="postResult"></div>
    
    <h2>3. View Stored Posts:</h2>
    <button onclick="viewPosts()">View Posts</button>
    <div id="postsView"></div>
    
    <script>
        const ADMIN_PASS = 'kga2801';
        
        function testPassword() {
            const pass = document.getElementById('testPass').value;
            const result = document.getElementById('result');
            if (pass === ADMIN_PASS) {
                result.innerHTML = '✅ Password correct!';
                result.style.color = 'green';
            } else {
                result.innerHTML = '❌ Invalid password';
                result.style.color = 'red';
            }
        }
        
        function createTestPost() {
            const testPost = {
                id: Date.now(),
                date: new Date().getDate().toString(),
                dateISO: new Date().toISOString(),
                title: 'Test Post Created ' + new Date().toLocaleTimeString(),
                content: 'This is a test post created at ' + new Date().toLocaleString(),
                excerpt: 'This is a test post excerpt...',
                category: 'Test',
                author: 'Test Author'
            };
            
            const existing = localStorage.getItem('blogPosts');
            const posts = existing ? JSON.parse(existing) : [];
            posts.unshift(testPost);
            localStorage.setItem('blogPosts', JSON.stringify(posts));
            
            document.getElementById('postResult').innerHTML = '✅ Post created! Refresh the main page to see it.';
            document.getElementById('postResult').style.color = 'green';
        }
        
        function viewPosts() {
            const posts = localStorage.getItem('blogPosts');
            const parsed = posts ? JSON.parse(posts) : [];
            const view = document.getElementById('postsView');
            
            view.innerHTML = '<h3>Current Posts in localStorage:</h3>';
            view.innerHTML += '<pre>' + JSON.stringify(parsed, null, 2) + '</pre>';
        }
    </script>
</body>
</html>
