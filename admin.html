<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gilber Garcia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-primary: #2d2d2d;
            --text-secondary: #6b6b6b;
            --text-light: #999;
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --accent: #c9a8e8;
            --accent-hover: #b392d8;
            --border: #e5e5e5;
            --max-width: 1200px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #e5e5e5;
                --text-secondary: #b0b0b0;
                --text-light: #808080;
                --bg-primary: #1a1a1a;
                --bg-secondary: #242424;
                --border: #333;
            }
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--bg-primary);
            min-height: 100vh;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'EB Garamond', serif;
            font-size: 28px;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--accent);
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
        }

        .login-box {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }

        @media (prefers-color-scheme: dark) {
            .login-box {
                background: var(--bg-secondary);
            }
        }

        .login-title {
            font-family: 'EB Garamond', serif;
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }

        .login-subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            background: #fff;
            color: #2d2d2d;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            .form-input {
                background: var(--bg-primary);
                color: var(--text-primary);
                border-color: var(--border);
            }
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201, 168, 232, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
            padding: 40px 0;
        }

        .admin-panel.active {
            display: block;
        }

        .panel-title {
            font-family: 'EB Garamond', serif;
            font-size: 36px;
            margin-bottom: 30px;
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            position: relative;
            transition: color 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--accent);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Editor */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .editor-panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 30px;
        }

        .preview-panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 30px;
        }

        .post-title-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 20px;
            margin-bottom: 20px;
        }

        .rich-editor {
            min-height: 400px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.7;
        }

        .rich-editor:focus {
            outline: none;
            border-color: var(--accent);
        }

        .editor-toolbar {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .editor-toolbar button {
            padding: 6px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .editor-toolbar button:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .toolbar-separator {
            width: 1px;
            background: var(--border);
            margin: 0 5px;
        }

        .editor-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn-primary, .btn-secondary {
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        /* Preview */
        .preview-label {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        .preview-content {
            padding: 20px;
            background: var(--bg-primary);
            border-radius: 8px;
            min-height: 400px;
        }

        .preview-title {
            font-family: 'EB Garamond', serif;
            font-size: 32px;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .preview-body {
            color: var(--text-primary);
            line-height: 1.7;
        }

        /* Auto Save Indicator */
        .auto-save-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .save-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-light);
            animation: pulse 2s ease-in-out infinite;
        }

        .save-dot.saving {
            background: #fbbf24;
            animation: pulse 0.5s ease-in-out infinite;
        }

        .save-dot.saved {
            background: #10b981;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Posts Manager */
        .posts-list {
            display: grid;
            gap: 15px;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .post-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .post-item-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .post-item-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-edit {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-edit:hover {
            background: var(--accent);
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <a href="/" class="logo">Gilber Garcia</a>
            <div class="nav-links">
                <a href="/" class="nav-link">← Back to Site</a>
                <a href="#" class="nav-link" id="logoutBtn" style="display:none;">Logout</a>
            </div>
        </nav>
    </header>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1 class="login-title">Admin Access</h1>
            <p class="login-subtitle">Enter your password to continue</p>
            <form onsubmit="checkPassword(event)">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="Enter admin password" required autofocus>
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel">
        <div class="container">
            <h1 class="panel-title">Admin Dashboard</h1>
            
            <!-- Tabs -->
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('write')">Write Post</button>
                <button class="tab-btn" onclick="switchTab('manage')">Manage Posts</button>
                <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
            </div>

            <!-- Write Tab -->
            <div id="writeTab" class="tab-content active">
                <div class="editor-container">
                    <div class="editor-panel">
                        <input type="text" id="postTitle" class="post-title-input" placeholder="Enter post title..." oninput="updatePreview()">
                        
                        <!-- Toolbar -->
                        <div class="editor-toolbar">
                            <button onclick="formatText('bold')" title="Bold"><b>B</b></button>
                            <button onclick="formatText('italic')" title="Italic"><i>I</i></button>
                            <button onclick="formatText('underline')" title="Underline"><u>U</u></button>
                            <span class="toolbar-separator"></span>
                            <button onclick="formatText('h2')" title="Heading">H2</button>
                            <button onclick="formatText('h3')" title="Subheading">H3</button>
                            <span class="toolbar-separator"></span>
                            <button onclick="formatText('ul')" title="Bullet List">• List</button>
                            <button onclick="formatText('ol')" title="Numbered List">1. List</button>
                            <span class="toolbar-separator"></span>
                            <button onclick="formatText('code')" title="Code">&lt;/&gt;</button>
                            <button onclick="formatText('quote')" title="Quote">"</button>
                        </div>
                        
                        <div id="postContent" class="rich-editor" contenteditable="true" oninput="updatePreview()" placeholder="Write your post content..."></div>
                        
                        <div class="auto-save-indicator">
                            <span class="save-dot" id="saveDot"></span>
                            <span id="saveStatus">Ready</span>
                        </div>
                    </div>
                    
                    <!-- Preview -->
                    <div class="preview-panel">
                        <h3 class="preview-label">Live Preview</h3>
                        <div class="preview-content">
                            <h1 class="preview-title" id="previewTitle">Your title will appear here...</h1>
                            <div class="preview-body" id="previewContent">
                                Start writing to see the preview...
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="editor-actions">
                    <button onclick="saveDraft()" class="btn-secondary">Save Draft</button>
                    <button onclick="publishPost()" class="btn-primary">Publish Post</button>
                </div>
            </div>

            <!-- Manage Tab -->
            <div id="manageTab" class="tab-content">
                <div class="posts-list" id="postsList">
                    <!-- Posts will be loaded here -->
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="settingsTab" class="tab-content">
                <div class="editor-panel">
                    <div class="form-group">
                        <label class="form-label">Export Posts</label>
                        <button onclick="exportPosts()" class="btn-secondary">Download posts.json</button>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Import Posts</label>
                        <input type="file" id="importFile" accept=".json" onchange="importPosts(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = 'kga2801';
        let editingPostId = null;
        let autoSaveTimer = null;

        // Check authentication on load
        if (sessionStorage.getItem('isAdminAuth') === 'true') {
            showAdminPanel();
        }

        // Password check
        function checkPassword(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            
            if (password === ADMIN_PASS) {
                sessionStorage.setItem('isAdminAuth', 'true');
                showAdminPanel();
            } else {
                alert('Invalid password');
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
        }

        // Show admin panel
        function showAdminPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            document.getElementById('logoutBtn').style.display = 'block';
            loadPosts();
            loadDraft();
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            sessionStorage.removeItem('isAdminAuth');
            window.location.reload();
        });

        // Tab switching
        function switchTab(tabName) {
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.style.display = 'none';
            });
            document.getElementById(tabName + 'Tab').style.display = 'block';

            // Load posts if switching to manage tab
            if (tabName === 'manage') {
                loadPosts();
            }
        }

        // Format text
        function formatText(command) {
            switch(command) {
                case 'bold':
                    document.execCommand('bold', false, null);
                    break;
                case 'italic':
                    document.execCommand('italic', false, null);
                    break;
                case 'underline':
                    document.execCommand('underline', false, null);
                    break;
                case 'h2':
                    document.execCommand('formatBlock', false, '<h2>');
                    break;
                case 'h3':
                    document.execCommand('formatBlock', false, '<h3>');
                    break;
                case 'ul':
                    document.execCommand('insertUnorderedList', false, null);
                    break;
                case 'ol':
                    document.execCommand('insertOrderedList', false, null);
                    break;
                case 'code':
                    const selection = window.getSelection().toString();
                    document.execCommand('insertHTML', false, `<code>${selection}</code>`);
                    break;
                case 'quote':
                    document.execCommand('formatBlock', false, '<blockquote>');
                    break;
            }
            document.getElementById('postContent').focus();
            updatePreview();
        }

        // Update preview
        function updatePreview() {
            const title = document.getElementById('postTitle').value || 'Your title will appear here...';
            const content = document.getElementById('postContent').innerHTML || 'Start writing to see the preview...';
            
            document.getElementById('previewTitle').textContent = title;
            document.getElementById('previewContent').innerHTML = content;
            
            // Auto save
            clearTimeout(autoSaveTimer);
            const saveDot = document.getElementById('saveDot');
            const saveStatus = document.getElementById('saveStatus');
            
            saveDot.classList.add('saving');
            saveStatus.textContent = 'Saving...';
            
            autoSaveTimer = setTimeout(() => {
                saveDraft(true);
            }, 1000);
        }

        // Save draft
        function saveDraft(auto = false) {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').innerHTML;
            
            const draft = {
                title: title,
                content: content,
                savedAt: new Date().toISOString()
            };
            
            localStorage.setItem('currentDraft', JSON.stringify(draft));
            
            const saveDot = document.getElementById('saveDot');
            const saveStatus = document.getElementById('saveStatus');
            
            saveDot.classList.remove('saving');
            saveDot.classList.add('saved');
            saveStatus.textContent = 'Saved';
            
            setTimeout(() => {
                saveDot.classList.remove('saved');
                saveStatus.textContent = 'Ready';
            }, 2000);
            
            if (!auto) {
                showNotification('Draft saved');
            }
        }

        // Load draft
        function loadDraft() {
            const draft = localStorage.getItem('currentDraft');
            if (draft) {
                const { title, content } = JSON.parse(draft);
                document.getElementById('postTitle').value = title || '';
                document.getElementById('postContent').innerHTML = content || '';
                updatePreview();
            }
        }

        // Publish post
        function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').innerHTML.trim();
            
            if (!title || !content) {
                alert('Please fill in both title and content');
                return;
            }
            
            const now = new Date();
            const post = {
                id: editingPostId || Date.now(),
                date: now.getDate().toString(),
                dateISO: now.toISOString(),
                title: title,
                content: content,
                excerpt: content.replace(/<[^>]*>/g, '').substring(0, 150) + '...',
                author: 'Gilber Garcia',
                readTime: Math.ceil(content.replace(/<[^>]*>/g, '').split(/\s+/).length / 200) + ' min read'
            };
            
            // Get existing posts
            const saved = localStorage.getItem('blogPosts');
            let posts = saved ? JSON.parse(saved) : [];
            
            if (editingPostId) {
                // Update existing post
                const index = posts.findIndex(p => p.id === editingPostId);
                if (index !== -1) {
                    posts[index] = post;
                }
                editingPostId = null;
            } else {
                // Add new post
                posts.unshift(post);
            }
            
            // Save posts
            localStorage.setItem('blogPosts', JSON.stringify(posts));
            
            // Clear draft
            localStorage.removeItem('currentDraft');
            
            // Reset form
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').innerHTML = '';
            updatePreview();
            
            // Show notification
            showNotification('Post published successfully!');
            
            // Redirect to home page after a short delay
            setTimeout(() => {
                window.location.href = '/#posts';
            }, 1000);
        }

        // Load posts for management
        function loadPosts() {
            const saved = localStorage.getItem('blogPosts');
            const posts = saved ? JSON.parse(saved) : [];
            
            const postsList = document.getElementById('postsList');
            if (!postsList) return;
            
            if (posts.length === 0) {
                postsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No posts yet</p>';
                return;
            }
            
            postsList.innerHTML = posts.map((post, index) => `
                <div class="post-item">
                    <div>
                        <div class="post-item-title">${post.title}</div>
                        <div class="post-item-meta">
                            ${new Date(post.dateISO || post.date).toLocaleDateString()} • ${post.readTime || '5 min read'}
                        </div>
                    </div>
                    <div class="post-item-actions">
                        <button class="btn-edit" onclick="editPost(${index})">Edit</button>
                        <button class="btn-delete" onclick="deletePost(${index})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Edit post
        function editPost(index) {
            const saved = localStorage.getItem('blogPosts');
            const posts = saved ? JSON.parse(saved) : [];
            const post = posts[index];
            
            if (post) {
                editingPostId = post.id;
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postContent').innerHTML = post.content;
                updatePreview();
                
                // Switch to write tab
                document.querySelectorAll('.tab-btn')[0].click();
                
                showNotification('Editing post: ' + post.title);
            }
        }

        // Delete post
        function deletePost(index) {
            if (confirm('Are you sure you want to delete this post?')) {
                const saved = localStorage.getItem('blogPosts');
                let posts = saved ? JSON.parse(saved) : [];
                posts.splice(index, 1);
                localStorage.setItem('blogPosts', JSON.stringify(posts));
                loadPosts();
                showNotification('Post deleted');
            }
        }

        // Export posts
        function exportPosts() {
            const posts = localStorage.getItem('blogPosts');
            const blob = new Blob([posts], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'posts.json';
            a.click();
            URL.revokeObjectURL(url);
            showNotification('Posts exported');
        }

        // Import posts
        function importPosts(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const posts = JSON.parse(e.target.result);
                        localStorage.setItem('blogPosts', JSON.stringify(posts));
                        loadPosts();
                        showNotification('Posts imported successfully');
                    } catch (error) {
                        alert('Invalid JSON file');
                    }
                };
                reader.readAsText(file);
            }
        }

        // Show notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
